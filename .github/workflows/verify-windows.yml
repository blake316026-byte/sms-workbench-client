name: Verify Windows Candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft candidate release tag
        required: true
        default: v0.5.0
permissions:
  contents: read
jobs:
  native-check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "*Windows*x64*.zip" --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "SHA256SUMS-*.txt" --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Checksum download failed' }
          $zip = Get-ChildItem candidate/*.zip
          $line = Get-Content (Get-ChildItem candidate/SHA256SUMS-*.txt).FullName | Where-Object { $_.EndsWith($zip.Name) }
          if (@($line).Count -ne 1) { throw 'Expected exactly one candidate checksum' }
          $expected = ($line -split '\s+')[0]
          if ((Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Candidate checksum mismatch' }
          Expand-Archive $zip.FullName -DestinationPath unpacked
      - name: Native startup, DPAPI, Cookies and two legacy upgrades
        shell: pwsh
        run: |
          $env:SMS_DISTRIBUTION_TEST_DIR = Join-Path $env:RUNNER_TEMP 'sms-release-profile'
          $env:SMS_MONITOR_LOCAL_AUTOMATION_CHECK = '1'
          $exe = (Resolve-Path 'unpacked/SMS Client/SMS Success Monitor.exe').Path
          foreach ($pass in 1..2) {
            $env:SMS_MONITOR_LOCAL_AUTOMATION_RESULT = Join-Path $env:RUNNER_TEMP "sms-check-$pass.txt"
            $process = Start-Process -FilePath $exe -PassThru
            if (!$process.WaitForExit(180000)) { $process.Kill(); throw 'Candidate timed out' }
            if ($process.ExitCode -ne 0) { throw "Candidate exit code $($process.ExitCode)" }
            if (!(Test-Path $env:SMS_MONITOR_LOCAL_AUTOMATION_RESULT)) { throw 'No verification result produced' }
            $result = Get-Content $env:SMS_MONITOR_LOCAL_AUTOMATION_RESULT -Raw
            Write-Output "Launch $pass : $result"
            if (!$result.StartsWith('PASS:')) { throw $result }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-results
          path: ${{ runner.temp }}/sms-check-*.txt
